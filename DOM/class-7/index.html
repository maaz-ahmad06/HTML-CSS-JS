<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Traversal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Products</h1>

    <div class="container">
        <div class="card">
            <h3>Laptop</h3>
            <p>Rs. 150,000</p>
            <div class="actions">
                <button class="prev-btn">Prev</button>
                <button class="next-btn">Next</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>

        <div class="card">
            <h3>Phone</h3>
            <p>Rs. 80,000</p>
            <div class="actions">
                <button class="prev-btn">Prev</button>
                <button class="next-btn">Next</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>

        <div class="card">
            <h3>Headphones</h3>
            <p>Rs. 12,000</p>
            <div class="actions">
                <button class="prev-btn">Prev</button>
                <button class="next-btn">Next</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
